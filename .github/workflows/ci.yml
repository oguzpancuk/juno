# CI runs the SAME battery agents run locally: .claude/hooks/verify.sh.
# One source of truth for "green" — if this file and verify.sh disagree,
# verify.sh wins and this file is wrong.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The RLS suite in supabase/tests runs against a real local stack; a
      # missing stack is a FAIL, never a skip, so CI must start one.
      # Only services no test touches may be excluded: photo.test.ts and
      # delete-account.test.ts call /functions/v1/*, so edge-runtime has to
      # boot or Kong answers 503 and those suites fail on a stack defect
      # rather than on the code.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0 # keep in step with SUPABASE_CLI_VERSION in supabase/tests/local.ts
      - run: supabase start -x studio,imgproxy,logflare,vector,mailpit
      - run: bash .claude/hooks/verify.sh
      - if: always()
        run: supabase stop
