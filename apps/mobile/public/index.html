<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      No `viewport-fit=cover`.

      It was added on 2026-09-17 to stop iOS letterboxing the notch and the
      home indicator in the page's own background, which was white at the
      time. The background is `color.bg` now, so the letterbox is the same
      colour as the app and there is nothing left for `cover` to buy.

      It went out as a suspect for the cluster the owner reported on
      2026-09-18 — things sitting about a status bar too low — and it was
      the wrong one: removing it moved nothing. The cause was ours, a flat
      status-bar-sized top padding on every screen added on top of the one
      the browser had already made, and it is fixed in `lib/insets.ts`.
      `cover` stays out because with the page painting `color.bg` there is
      nothing left for it to buy.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <!--
      What paints the browser's own furniture: Safari's toolbars and
      Chrome's address bar take this colour, so the app no longer sits in a
      white frame. Same value as `color.bg` in theme/tokens.ts and as the
      splash in app.json; all three have to move together.
    -->
    <meta name="theme-color" content="#07060F" />
    <!--
      The tab icon. Expo generates one from `web.favicon` only when the
      project has no `public/favicon.ico`; this one is built from
      `public/icon.svg` by `scripts/web-icons.py`, so the links are written
      here rather than appended by the CLI. The SVG goes first for the
      browsers that prefer it — it is the only one that stays sharp on a
      3× display.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /*
        These styles disable page scrolling; every scroll in this app is a
        <ScrollView> of its own.

        Expo's template does it with `body { overflow: hidden }`. This does
        it on `html`, with `clip` where the browser has it, and leaves
        `body` visible — and both halves matter to iOS Safari, which keeps
        a strip under the page for its floating toolbar and shows there
        whatever the document paints past its own bottom edge. `hidden`
        cuts that off at the edge and leaves the strip a flat colour.
        `clip` forbids scrolling just the same but is not a scroll
        container, and Safari shows the overhang. On `body` it does not
        work: `body` then clips its own descendants at the page's edge
        before the viewport ever sees them (`scrollHeight` stays at the
        window's height), so `body` has to let them through.

        Tried in the iOS 26.5 simulator on 2026-09-21, one property at a
        time: `hidden` anywhere cut the sky with a ruled line, so did
        `position: fixed`, so did `clip` on both; a scrollable document
        showed it but scrolled; `clip` on `html` alone showed it and did
        not move. `CosmicGround` overhangs its host (OVERHANG) to have
        something to show there.

        `hidden` first, so a browser without `clip` keeps what it had.
      */
      html {
        overflow: hidden;
        overflow: clip;
      }
      body {
        overflow: visible;
      }
      /*
        While a text field has the focus, the old shape. The overhang makes
        the document 240 points taller than its window (`scrollHeight`),
        and a taller document is one iOS may scroll to bring a focused
        field above the keyboard — where today it can only pan the visual
        viewport, which is what `lib/keyboard.ts` measures to lift the
        chat composer. Nothing is lost by it: the keyboard covers the strip
        the overhang exists to fill. The class is set by the script below.
        Checked in the simulator: with the class on, `scrollHeight` is the
        window's again.
      */
      html.typing body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="juno-ground">
      /*
        The night sky, from the first byte. React Native paints it too, but
        only once the bundle has run, and the canvas outside the app tree —
        the strip a mobile browser reveals when its toolbars collapse, and
        everything behind a rubber-band scroll — is never part of that tree.
        Left to itself it is white, top and bottom.

        `color-scheme` is the other half: it is what tells the engine to
        paint its own scaffolding — the canvas under the page, scrollbars,
        the overscroll gutter — dark instead of white.
      */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        background-color: #07060f;
      }
      /*
        The page matches the area that is actually visible. `height: 100%`
        sizes it to the viewport reported at load, and a mobile browser
        that then retracts its toolbar leaves the page short of the
        screen; `dvh` tracks the visible area as the toolbars come and go.

        This is not what fixes the black band at the bottom that the owner
        saw on 2026-09-18. That band is the strip iOS Safari keeps under
        the page for its toolbar, which no height of ours reaches; see
        `overflow: clip` above and OVERHANG in `CosmicGround`. It is here
        because a page the size of its window is right on its own terms.
      */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      body {
        /* No rubber-banding past the app: there is nothing behind it to
           reveal, and on iOS the reveal is where the white came back. */
        overscroll-behavior: none;
      }
    </style>
  </head>

  <body>
    <script>
      // Sets `html.typing` while a text field is focused; see the rule of
      // that name above. Plain DOM, before the bundle, so it holds from
      // the first field a person can reach.
      (function () {
        var root = document.documentElement;
        function isField(target) {
          return (
            target instanceof Element &&
            target.matches('input, textarea, [contenteditable="true"]')
          );
        }
        addEventListener('focusin', function (event) {
          if (isField(event.target)) root.classList.add('typing');
        });
        addEventListener('focusout', function (event) {
          if (isField(event.target)) root.classList.remove('typing');
        });
      })();
    </script>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
